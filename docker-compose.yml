services:
  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8080
    env_file: [.env]
    environment:
      VAULTAGENT_STATE_DIR: /app/state
      VAULTAGENT_LOCAL_BASE_URL: http://host.docker.internal:8000/v1
      VAULTAGENT_QDRANT_URL: http://qdrant:6333
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [vaultagent_state:/app/state]
    ports: ["8080:8080"]
    depends_on: [qdrant]
  demo:
    build: .
    command: streamlit run demo/app.py --server.address=0.0.0.0 --server.port=8501
    environment:
      VAULTAGENT_API_URL: http://api:8080
    ports: ["8501:8501"]
    depends_on: [api]
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["3000:80"]
    depends_on: [api]
  qdrant:
    image: qdrant/qdrant:latest
    volumes: [qdrant_data:/qdrant/storage]
    ports: ["6333:6333"]
volumes:
  vaultagent_state:
  qdrant_data:
