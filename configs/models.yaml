version: 2
local_qwen:
  provider: openai_compatible
  recommended_model: Qwen/Qwen2.5-7B-Instruct
  serving_engine: vllm
  trusted_domain: true
  may_receive_raw_private_data: true
  api_base: http://127.0.0.1:8000/v1
  timeout_seconds: 180
  max_tokens: 2048
  temperature: 0.1
cloud_deepseek:
  provider: deepseek
  recommended_model: deepseek-v4-flash
  trusted_domain: false
  may_receive_raw_private_data: false
  api_base: https://api.deepseek.com
  timeout_seconds: 90
  max_tokens: 2048
  temperature: 0
embedding:
  status: optional_not_wired_by_default
  recommended_model: BAAI/bge-m3
  api_base: http://127.0.0.1:8000/v1/embeddings
  dimension: 1024
reranker:
  status: optional_not_wired_by_default
  recommended_model: BAAI/bge-reranker-v2-m3
  api_base: http://127.0.0.1:8000/v1/rerank
qdrant:
  url: http://127.0.0.1:6333
  collection: vaultagent_knowledge
  vector_size: 1024
  distance_metric: cosine